services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: myapp
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: myapp_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myapp -d myapp_db"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://myapp:secret@db:5432/myapp_db
      JWT_SECRET: budgetwise_dev_secret_9f3a2c1d7e6b5a4c8d1f0e9b2a7c6d5e
      JWT_REFRESH_SECRET: budgetwise_dev_refresh_secret_7a2c1d9e6b5f4a8c3d1f0e9b2a7c6d5e
      PORT: 5001
      CORS_ORIGIN: http://localhost:3000,http://127.0.0.1:3000
      RESET_PASSWORD_SENDER_NAME: Budgetwise
      RESET_PASSWORD_SENDER_ADDRESS: no-reply@example.com
      # AI (Groq): set GROQ_API_KEY in a `budgetwise/.env` file (see README) or export before `compose up`.
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENAI_API_KEY: ""
      MOCK_DATA_XLSX: /app/mock-data/personal_transactions_budgetwise_2025_2026.xlsx
    ports:
      - "5001:5001"
    volumes:
      - ./backend/mock-data:/app/mock-data:ro

  mock-seed:
    build:
      context: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://myapp:secret@db:5432/myapp_db
      JWT_SECRET: budgetwise_dev_secret_9f3a2c1d7e6b5a4c8d1f0e9b2a7c6d5e
      CORS_ORIGIN: http://localhost:3000
      MOCK_DATA_XLSX: /app/mock-data/personal_transactions_budgetwise_2025_2026.xlsx
      MOCK_DATA_WIPE: "true"
    volumes:
      - ./backend/mock-data:/app/mock-data:ro
    command: npm run mock:data
    restart: "no"
    profiles: ["tools"]

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:5001
    ports:
      - "3000:10000"

volumes:
  postgres_data: